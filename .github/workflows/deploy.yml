name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CI is green for this ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "Looking up CI workflow runs for $sha"
          # Find the most recent CI run on this SHA and assert success.
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}" \
            --jq '.workflow_runs[0].conclusion // ""')
          echo "CI conclusion on ${sha}: ${conclusion:-<none>}"
          if [ "$conclusion" != "success" ]; then
            echo "Refusing to deploy: no successful CI run for this ref."
            exit 1
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy API (runs migrations + grants via release_command)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly/api.fly.toml --remote-only

      - name: Deploy web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly/web.fly.toml --remote-only
