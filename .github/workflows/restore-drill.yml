name: Restore drill

# A manual job that proves the daily backup is actually restorable.
#
# Picks the newest `sila-db-backup-*` artifact produced by backup.yml,
# age-decrypts it using the operator-set private key, restores the dump
# into a disposable Neon branch, then compares per-table row counts
# between the live database and the restored copy.
#
# Security-critical: the age private key and the branch URL come from
# repository secrets (RESTORE_AGE_KEY, RESTORE_BRANCH_URL), NOT from
# workflow_dispatch inputs. Inputs persist in the run's parameters
# forever and are visible to anyone with read access to the Actions
# tab — rotating after the fact does not protect the backups already
# made with that key.
#
# Operator flow:
#   1. Create a disposable Neon branch; copy its direct-endpoint URL.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#      add `RESTORE_BRANCH_URL` (the Neon branch URL) and
#      add `RESTORE_AGE_KEY`    (the contents of ~/.sila/sila-backup-key.txt).
#   3. GitHub -> Actions -> Restore drill -> Run workflow.
#   4. When the job finishes, DELETE both secrets AND the Neon branch.
#
# Rotation note: if the age keypair is ever rotated, keep the OLD
# private key for at least the artifact retention window (30 days)
# because older backups are still encrypted to the old public key.

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Specific backup.yml run id to restore from. Leave blank for the newest successful run."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Require restore secrets
        env:
          RESTORE_AGE_KEY: ${{ secrets.RESTORE_AGE_KEY }}
          RESTORE_BRANCH_URL: ${{ secrets.RESTORE_BRANCH_URL }}
        run: |
          # Fail fast if either secret is missing. Do NOT echo their values.
          if [ -z "${RESTORE_AGE_KEY:-}" ]; then
            echo "::error::RESTORE_AGE_KEY secret is not set. Add it, re-run, delete it afterwards."
            exit 1
          fi
          if [ -z "${RESTORE_BRANCH_URL:-}" ]; then
            echo "::error::RESTORE_BRANCH_URL secret is not set. Add it, re-run, delete it afterwards."
            exit 1
          fi

      - name: Install postgres-client-16 and age
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age jq
          pg_restore --version
          age --version

      - name: Pick the backup artifact to restore from
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            run_id="$REQUESTED"
          else
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No backup.yml run found"
            exit 1
          fi
          artifact_name="sila-db-backup-${run_id}"
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${artifact_name}\") | .id")
          if [ -z "$artifact_id" ]; then
            echo "Artifact ${artifact_name} not found on run ${run_id}"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "Restoring from ${artifact_name} (run ${run_id})"

      - name: Download the encrypted dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.pick.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o backup.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q backup.zip
          dump_file=$(ls sila-*.dump.age | head -1)
          echo "DUMP_FILE=${dump_file}" >> "$GITHUB_ENV"
          echo "Downloaded ${dump_file} ($(stat -c%s "${dump_file}") bytes)"

      - name: Decrypt the dump
        env:
          RESTORE_AGE_KEY: ${{ secrets.RESTORE_AGE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          # Secret contents never appear in the log — GitHub masks them,
          # and we write to a temp file instead of echoing.
          printf '%s\n' "$RESTORE_AGE_KEY" > "$key_file"
          plain="${DUMP_FILE%.age}"
          age --decrypt -i "$key_file" -o "$plain" "$DUMP_FILE"
          rm -f "$key_file"
          echo "PLAIN=${plain}" >> "$GITHUB_ENV"
          echo "Decrypted to ${plain} ($(stat -c%s "${plain}") bytes)"

      - name: Restore into the Neon branch
        env:
          RESTORE_BRANCH_URL: ${{ secrets.RESTORE_BRANCH_URL }}
        run: |
          set -euo pipefail
          # The URL is already masked by GitHub as a secret. Pass it in
          # via env only; pg_restore never echoes its connection string.
          pg_restore --no-owner --no-privileges --clean --if-exists \
            --dbname="$RESTORE_BRANCH_URL" "$PLAIN"

      - name: Row-count comparison (live vs restored)
        env:
          LIVE: ${{ secrets.DATABASE_ADMIN_URL }}
          RESTORE_BRANCH_URL: ${{ secrets.RESTORE_BRANCH_URL }}
        run: |
          set -euo pipefail
          tables="users sessions vault_keys vault_results partner_links consents relatives referrals referral_steps volunteers volunteer_quiz volunteer_ttr audit_log admin_invites admin_totp"
          mismatches=0
          printf '%-24s  %10s  %10s\n' TABLE LIVE RESTORED
          printf '%-24s  %10s  %10s\n' "------" "------" "------"
          for t in $tables; do
            live_n=$(psql "$LIVE" -At -c "select count(*) from \"$t\";" 2>/dev/null || echo "-")
            back_n=$(psql "$RESTORE_BRANCH_URL" -At -c "select count(*) from \"$t\";" 2>/dev/null || echo "-")
            printf '%-24s  %10s  %10s\n' "$t" "$live_n" "$back_n"
            if [ "$live_n" != "$back_n" ]; then
              mismatches=$((mismatches + 1))
            fi
          done
          if [ "$mismatches" -gt 0 ]; then
            echo "::error::$mismatches table(s) differed between live and restored"
            exit 1
          fi
          echo "All tables matched."

      - name: Reminder — delete the secrets and the Neon branch
        run: |
          echo "Restore drill complete. Operator actions:"
          echo "  1. GitHub -> Settings -> Secrets and variables -> Actions:"
          echo "     DELETE 'RESTORE_AGE_KEY' and 'RESTORE_BRANCH_URL'."
          echo "  2. Neon console -> Branches: DELETE the disposable branch you created."
          echo "  3. If you rotate the age keypair later, keep the OLD private key"
          echo "     for at least 30 days — older encrypted backups are still"
          echo "     encrypted to the old public key."
