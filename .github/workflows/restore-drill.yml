name: Restore drill

# A manual job that proves the daily backup is actually restorable.
#
# Picks the newest `sila-db-backup-*` artifact produced by backup.yml,
# age-decrypts it using the operator-pasted private key, restores the
# dump into the Neon branch whose URL the operator pastes, then compares
# per-table row counts between the live database and the restored copy.
# The operator deletes the Neon branch afterwards.
#
# Security notes
# - The age private key is a workflow_dispatch input, not a GitHub secret.
#   It is persisted in the workflow run's parameters alongside the run,
#   which is why we only use this flow occasionally and recommend rotating
#   the key after each drill. The first step masks the key in logs with
#   ::add-mask:: so it does not appear in any log line that happens to
#   print it.
# - The branch URL must point at a Neon BRANCH, not the primary. Rows are
#   written only to that branch; live data is read-only (row counts only).
# - DATABASE_ADMIN_URL continues to point at the primary — for read-only
#   SELECT count(*) comparisons.

on:
  workflow_dispatch:
    inputs:
      branch_url:
        description: "Neon branch connection string (restore target). Must be a disposable branch — this workflow will pg_restore into it."
        required: true
        type: string
      age_key:
        description: "Contents of ~/.sila/sila-backup-key.txt (the AGE-SECRET-KEY-... line). Will be masked in logs. Rotate it after the drill."
        required: true
        type: string
      backup_run_id:
        description: "Specific backup.yml run id to restore from. Leave blank for the newest successful run."
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the age key in logs
        env:
          AGE_KEY: ${{ inputs.age_key }}
        run: |
          # Drop the secret into the log masker before anything else runs.
          # The key itself never gets echoed.
          printf '::add-mask::%s\n' "$AGE_KEY"

      - name: Install postgres-client-16 and age
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age jq
          pg_restore --version
          age --version

      - name: Pick the backup artifact to restore from
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            run_id="$REQUESTED"
          else
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No backup.yml run found"
            exit 1
          fi
          artifact_name="sila-db-backup-${run_id}"
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${artifact_name}\") | .id")
          if [ -z "$artifact_id" ]; then
            echo "Artifact ${artifact_name} not found on run ${run_id}"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "Restoring from ${artifact_name} (run ${run_id})"

      - name: Download the encrypted dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.pick.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o backup.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q backup.zip
          dump_file=$(ls sila-*.dump.age | head -1)
          echo "DUMP_FILE=${dump_file}" >> "$GITHUB_ENV"
          echo "Downloaded ${dump_file} ($(stat -c%s "${dump_file}") bytes)"

      - name: Decrypt the dump
        env:
          AGE_KEY: ${{ inputs.age_key }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          printf '%s\n' "$AGE_KEY" > "$key_file"
          plain="${DUMP_FILE%.age}"
          age --decrypt -i "$key_file" -o "$plain" "$DUMP_FILE"
          rm -f "$key_file"
          echo "PLAIN=${plain}" >> "$GITHUB_ENV"
          echo "Decrypted to ${plain} ($(stat -c%s "${plain}") bytes)"

      - name: Restore into the Neon branch
        env:
          BRANCH_URL: ${{ inputs.branch_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::${BRANCH_URL}"
          pg_restore --no-owner --no-privileges --clean --if-exists \
            --dbname="$BRANCH_URL" "$PLAIN"

      - name: Row-count comparison (live vs restored)
        env:
          LIVE: ${{ secrets.DATABASE_ADMIN_URL }}
          BRANCH_URL: ${{ inputs.branch_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::${BRANCH_URL}"
          tables="users sessions vault_keys vault_results partner_links consents relatives referrals referral_steps volunteers volunteer_quiz volunteer_ttr audit_log"
          mismatches=0
          printf '%-24s  %10s  %10s\n' TABLE LIVE RESTORED
          printf '%-24s  %10s  %10s\n' "------" "------" "------"
          for t in $tables; do
            live_n=$(psql "$LIVE" -At -c "select count(*) from \"$t\";" 2>/dev/null || echo "-")
            back_n=$(psql "$BRANCH_URL" -At -c "select count(*) from \"$t\";" 2>/dev/null || echo "-")
            printf '%-24s  %10s  %10s\n' "$t" "$live_n" "$back_n"
            if [ "$live_n" != "$back_n" ]; then
              mismatches=$((mismatches + 1))
            fi
          done
          if [ "$mismatches" -gt 0 ]; then
            echo "::error::$mismatches table(s) differed between live and restored"
            exit 1
          fi
          echo "All tables matched."

      - name: Reminder — delete the Neon branch and rotate the age key
        run: |
          echo "Restore drill complete. Operator actions:"
          echo "  1. Open the Neon console and DELETE the branch you created for this drill."
          echo "  2. Rotate ~/.sila/sila-backup-key.txt (the age key you pasted is now part of this run's metadata)."
          echo "     - Generate a new keypair: age-keygen -o ~/.sila/sila-backup-key.txt"
          echo "     - Update the AGE_RECIPIENT GitHub repo secret to the new public key."
          echo "     - The next backup.yml run will encrypt to the new key; older dumps still need the old key."
