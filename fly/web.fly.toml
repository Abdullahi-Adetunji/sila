# Public Next.js app. The /api/* rewrite points at the private API host
# (sila-api.internal:4000) — see next.config.ts and SILA_API_ORIGIN.
# All Fly secrets are set via `fly secrets set` against this app.

app = "sila-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.web"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SILA_API_ORIGIN = "http://sila-api.internal:4000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
