services:
  postgres:
    image: postgres:16-alpine
    container_name: sila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sila
    ports:
      - "5432:5432"
    volumes:
      - sila-pg-data:/var/lib/postgresql/data
      - ./scripts/sql/setup-roles.sql:/docker-entrypoint-initdb.d/00-setup-roles.sql:ro
      - ./scripts/sql/docker-set-passwords.sql:/docker-entrypoint-initdb.d/01-set-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sila"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sila-pg-data:
